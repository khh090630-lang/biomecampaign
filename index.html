<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방역 퀴즈 - 랜덤 문제 풀이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
        .ox-btn { transition: all 0.2s ease-in-out; }
        .ox-btn:hover { transform: scale(1.05); }
        .ox-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-gray-100 py-8 px-4 font-sans text-gray-900 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-3xl bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200 relative">
        
        <!-- 헤더 -->
        <div class="bg-blue-900 text-white p-6 text-center border-b-4 border-blue-700">
            <h1 class="text-3xl font-extrabold tracking-tight" onclick="resetToHome()" style="cursor: pointer;">방역 원리 모의고사</h1>
            <p class="mt-2 text-blue-200 text-sm">개념 확인부터 실전 문제까지, 1문제씩 랜덤으로 풀어보세요!</p>
        </div>

        <!-- 홈 화면 (난이도 선택) -->
        <div id="home-screen" class="p-8 text-center space-y-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-8">풀이할 문제의 난이도를 선택하세요</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <button onclick="loadQuestion('easy')" class="group flex flex-col items-center justify-center p-8 bg-green-50 border-2 border-green-500 rounded-xl hover:bg-green-500 hover:text-white transition-all duration-300">
                    <span class="text-4xl mb-4">🌱</span>
                    <span class="text-2xl font-bold mb-2">개념 확인 (O/X)</span>
                    <span class="text-sm opacity-80 font-medium">손 위생 원리</span>
                </button>
                <button onclick="loadQuestion('hard')" class="group flex flex-col items-center justify-center p-8 bg-red-50 border-2 border-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-all duration-300">
                    <span class="text-4xl mb-4">🔥</span>
                    <span class="text-2xl font-bold mb-2">실전 고난도 (객관식)</span>
                    <span class="text-sm opacity-80 font-medium">데이터 분석 및 추론</span>
                </button>
            </div>
        </div>

        <!-- 문제 풀이 화면 -->
        <div id="quiz-screen" class="hidden p-6 md:p-10">
            <!-- 상태 표시줄 -->
            <div class="flex justify-between items-center mb-6 text-sm font-bold text-gray-500 border-b pb-4">
                <span id="quiz-type-badge" class="px-3 py-1 rounded-full bg-gray-200">난이도</span>
                <button onclick="resetToHome()" class="hover:text-blue-600 underline">처음으로</button>
            </div>

            <!-- 문제 내용 -->
            <div id="question-content" class="min-h-[200px]">
                <!-- JS로 렌더링 됨 -->
            </div>

            <!-- 결과 피드백 영역 -->
            <div id="feedback-area" class="hidden mt-8 p-6 rounded-lg text-center font-bold text-xl animate-bounce">
            </div>

            <!-- 하단 컨트롤 -->
            <div id="quiz-controls" class="hidden mt-8 flex justify-center">
                <button onclick="loadQuestion(currentMode)" class="px-8 py-3 bg-blue-600 text-white font-bold rounded-lg shadow-lg hover:bg-blue-700 transition-colors">
                    다음 문제 뽑기 🎲
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- [데이터: 쉬운 문제 (O/X)] ---
        const easyQuestions = [
            { id: 1, title: "에탄올은 세균 단백질의 1차 구조인 아미노산 간의 펩타이드 결합을 직접 절단하여 살균한다.", answer: "X", explain: "에탄올은 2, 3차 입체 구조를 유지하는 수소 결합을 교란시킬 뿐, 펩타이드 결합을 절단하지 않습니다." },
            { id: 2, title: "에탄올은 단백질의 입체 구조를 유지하는 수소 결합을 교란하여 단백질을 응고(변성)시킨다.", answer: "O" },
            { id: 3, title: "에탄올로 소독한 후에는 세균의 사체가 피부 표면에 잔류한다.", answer: "O" },
            { id: 4, title: "100% 에탄올은 세균 표면의 수분을 날려 겉면 단백질을 굳힘으로써 내부 투과가 차단되어 살균력이 감소한다.", answer: "O" },
            { id: 5, title: "70% 에탄올 수용액 내의 물 분자는 단백질 구조 붕괴의 촉매 및 내부 침투 역할을 한다.", answer: "O" },
            { id: 6, title: "비누(계면활성제)는 물과 상호작용하는 친수성 머리와 무극성 용매와 상호작용하는 소수성 꼬리를 지닌 양친매성 분자이다.", answer: "O" },
            { id: 7, title: "계면활성제의 수용액 내 농도가 임계 마이셀 농도 미만일 때 자발적으로 구형 구조체(미셀)를 형성한다.", answer: "X", explain: "임계 마이셀 농도 '이상'일 때 자발적으로 형성됩니다." },
            { id: 8, title: "미셀 형성은 물 분자들의 자유도가 증가하여 전체 계의 엔트로피가 증가하는 방향으로 진행된다.", answer: "O" },
            { id: 9, title: "비누의 친수성 머리가 병원체 지질막 및 유기물 내부로 침투하여 결합한다.", answer: "X", explain: "유기물 내부로 침투하는 것은 친수성 머리가 아니라 '소수성 꼬리'입니다." },
            { id: 10, title: "비누의 소수성 꼬리는 유기물과 분산력(무극성 분자 간 인력)으로 결합한다.", answer: "O" },
            { id: 11, title: "비누 세정 시 친수성 머리가 흐르는 물과 인력을 형성하여 병원체와 오염물을 피부 표면에서 뜯어낸다.", answer: "O" },
            { id: 12, title: "비누로 손을 씻은 후에는 에탄올과 마찬가지로 세균의 사체가 피부에 잔류한다.", answer: "X", explain: "비누 세정 시 물리적 이탈(뜯어냄)이 동반되어 사체가 잔류하지 않습니다." },
            { id: 13, title: "땀, 피지 등 유기물이 존재하는 피부 표면에 에탄올을 도포하면 '캡슐화 역효과'가 발생한다.", answer: "O" },
            { id: 14, title: "캡슐화 역효과 발생 시 에탄올이 유기물 겉표면의 단백질을 응고시켜 병원체를 보호하는 코팅막을 형성한다.", answer: "O" },
            { id: 15, title: "유기물이 많을 때 형성된 캡슐화 코팅막은 병원체의 사멸 시간을 단축시킨다.", answer: "X", explain: "투과를 차단하여 병원체를 보호하므로 생존율이 오히려 상승합니다." },
            { id: 16, title: "비누 거품을 낸 후 흐르는 물에 씻지 않으면 용해된 세균과 미셀이 피부에 잔류하게 된다.", answer: "O" },
            { id: 17, title: "손에 물기가 많은 상태에서 70% 에탄올을 도포하면 소독제가 희석되어 단백질 변성 임계 농도 미만으로 떨어진다.", answer: "O" },
            { id: 18, title: "교실이나 도서관 문손잡이 등 유기물이 없는 건조한 접촉 오염 환경에서는 에탄올 도포만으로도 방역이 가능하다.", answer: "O" },
            { id: 19, title: "식사 후나 체육관 등 유기물 오염 환경에서는 캡슐화 현상을 유도하기 위해 에탄올을 우선 사용해야 한다.", answer: "X", explain: "유기물 오염 시에는 캡슐화 방지를 위해 비누와 흐르는 물 세정이 필수입니다." },
            { id: 20, title: "비누의 작용 기전 중 용해 과정에서는 소수성 꼬리가 병원체 지질막 내부로 침투한다.", answer: "O" },
            { id: 21, title: "미셀이 형성되는 열역학적 이유는 전체 계의 엔트로피가 감소하는 방향으로 진행되기 때문이다.", answer: "X", explain: "엔트로피가 '증가'하는 방향으로 자발적으로 진행됩니다." },
            { id: 22, title: "에탄올의 살균 원리는 병원체의 2, 3차 단백질 입체 구조를 교란시키는 것이다.", answer: "O" },
            { id: 23, title: "손에 묻은 먼지만 있는 건조 환경에서는 에탄올의 캡슐화 역효과가 발생하지 않는다.", answer: "O" },
            { id: 24, title: "유기물 오염 환경을 방역할 때는 분산력 작용과 비누를 이용한 흐르는 물 세정이 필수적이다.", answer: "O" },
            { id: 25, title: "잔류 수분에 의해 70% 에탄올이 희석되어도 살균 효과는 100% 동일하게 유지된다.", answer: "X", explain: "약 60~80% 미만으로 희석되면 단백질 변성 임계 농도를 충족하지 못해 살균력이 감소합니다." }
        ];

        // --- [데이터: 고난도 문제 (객관식)] ---
        // (기존 1~12번 데이터 동일)
        const hardQuestions = [
            {
                id: 1,
                title: "[문제 1] 제공된 그래프는 무기물 표면에서 방역 물질 X, Y 수용액의 농도 변화에 따른 세균 사멸 시간을 측정한 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, X, Y는 각각 에탄올과 계면활성제 중 하나이며, Y 처리 시에는 수류 세정이 동반된다고 가정한다.)",
                visual: `
                <div class="flex justify-center my-4">
                    <svg viewBox="0 0 350 250" class="w-80 h-auto border border-gray-300 p-4 bg-white">
                        <polyline points="40,20 40,200 320,200" fill="none" stroke="black" stroke-width="2" />
                        <polygon points="37,20 43,20 40,10" fill="black" />
                        <polygon points="320,197 320,203 330,200" fill="black" />
                        <text x="15" y="30" font-size="12" font-weight="bold">세균</text>
                        <text x="5" y="45" font-size="12" font-weight="bold">사멸시간</text>
                        <text x="270" y="225" font-size="12" font-weight="bold">수용액 농도</text>
                        <path d="M 50,40 Q 120,190 180,180 Q 230,140 260,60" fill="none" stroke="black" stroke-width="1.5" />
                        <text x="270" y="55" font-size="14" font-weight="bold">X</text>
                        <path d="M 60,80 Q 120,190 180,190 L 300,180" fill="none" stroke="black" stroke-width="1.5" />
                        <text x="310" y="185" font-size="14" font-weight="bold">Y</text>
                        <line x1="180" y1="198" x2="180" y2="202" stroke="black" stroke-width="2" />
                        <text x="175" y="215" font-size="14" font-weight="bold">C</text>
                    </svg>
                </div>`,
                bogi: [
                    "ㄱ. 물질 X의 농도가 특정 농도보다 커질 때 사멸 시간이 급격히 증가하는 이유는 세균 표면 단백질의 급격한 응고로 인해 X 분자의 내부 투과가 차단되기 때문이다.",
                    "ㄴ. 농도 C에서 세균 사멸 직후 병원체의 사체를 피부 표면에서 이탈시키는 비율은 Y가 X보다 높다.",
                    "ㄷ. 농도가 C로 고정된 X 수용액을 유기물이 다량 존재하는 표면에 각각 도포할 경우, X의 그래프는 +y 방향으로 평행이동할 것이다."
                ],
                options: ["① ㄱ", "② ㄴ", "③ ㄱ, ㄴ", "④ ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"],
                answer: 3
            },
            {
                id: 2,
                title: "[문제 2] 표는 환경 (가)와 (나)에 방역 물질 X ~ Z를 각각 단독 처리했을 때의 세균 생존율 상대값을 나타낸 것이다. X ~ Z는 각각 70% 에탄올, 100% 에탄올, 계면활성제 중 하나이고, (가)와 (나)는 각각 건조한 손과 유분이 있는 손 중 하나이다.",
                visual: `
                <div class="flex flex-col items-center gap-4 my-4">
                    <table class="w-full max-w-sm text-center border-collapse text-sm bg-black text-white">
                        <thead>
                            <tr>
                                <th class="border border-gray-600 p-2">환경</th>
                                <th class="border border-gray-600 p-2">X 처리 시</th>
                                <th class="border border-gray-600 p-2">Y 처리 시</th>
                                <th class="border border-gray-600 p-2">Z 처리 시</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="border border-gray-600 p-2">(가)</td>
                                <td class="border border-gray-600 p-2">100</td>
                                <td class="border border-gray-600 p-2">a</td>
                                <td class="border border-gray-600 p-2">0</td>
                            </tr>
                            <tr>
                                <td class="border border-gray-600 p-2">(나)</td>
                                <td class="border border-gray-600 p-2">0</td>
                                <td class="border border-gray-600 p-2">b</td>
                                <td class="border border-gray-600 p-2">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>`,
                bogi: [
                    "ㄱ. X는 100% 에탄올, (가)는 유분이 있는 손이다.",
                    "ㄴ. b > a 이다.",
                    "ㄷ. (가) 환경에서 Z를 처리한 후 피부 표면에 남아있는 세균 사체량은 Y를 처리했을 때보다 많다."
                ],
                options: ["① ㄱ", "② ㄴ", "③ ㄱ, ㄴ", "④ ㄱ, ㄷ", "⑤ ㄴ, ㄷ"],
                answer: 1
            },
            {
                id: 5,
                title: "[문제 5] 그림은 유기물이 존재하는 피부 표면에 물질 P를 도포했을 때 임의의 세 시점 t1, t2, t3에서 측정한 '표면 단백질 응고 두께(d)'와 '세균 생존율(v)'을 순서 없이 나타낸 개형 추론표이다.",
                visual: `
                <div class="flex flex-col gap-4 my-4">
                    <table class="text-center border-collapse text-sm bg-black text-white">
                        <tbody>
                            <tr>
                                <th class="border border-gray-600 p-2 bg-gray-900">시간</th>
                                <td class="border border-gray-600 p-2">t₁</td>
                                <td class="border border-gray-600 p-2">t₂</td>
                                <td class="border border-gray-600 p-2">t₃</td>
                            </tr>
                            <tr>
                                <th class="border border-gray-600 p-2 bg-gray-900">응고 두께</th>
                                <td class="border border-gray-600 p-2">d₁</td>
                                <td class="border border-gray-600 p-2">d₂</td>
                                <td class="border border-gray-600 p-2">d₃</td>
                            </tr>
                            <tr>
                                <th class="border border-gray-600 p-2 bg-gray-900">생존율</th>
                                <td class="border border-gray-600 p-2">v₁</td>
                                <td class="border border-gray-600 p-2">v₂</td>
                                <td class="border border-gray-600 p-2">v₃</td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="text-sm bg-gray-100 p-3 rounded">
                        [조건] 1. t1, t2, t3는 도포 후 경과 시간 T1, T2, T3 (T1 < T2 < T3)를 순서 없이 나타냄.<br>
                        2. 응고 두께는 d2가 d1, d2, d3 중 최댓값이다.<br>
                        3. 생존율은 v3 > v1 이다.
                    </div>
                </div>`,
                bogi: [
                    "ㄱ. 이 실험에서 실제 시간의 흐름은 t3 -> t1 -> t2 순서이다.",
                    "ㄴ. d가 두꺼워지는 원인은 소수성 꼬리가 유기물 내부로 침투했기 때문이다.",
                    "ㄷ. t2 시점에서 v2가 높은 수치를 유지하는 이유는 d가 방어막 역할을 했기 때문이다."
                ],
                options: ["① ㄱ", "② ㄷ", "③ ㄱ, ㄴ", "④ ㄱ, ㄷ", "⑤ ㄴ, ㄷ"],
                answer: 4
            },
            {
                id: 6,
                title: "[문제 6] 다음은 방역 물질 (가)~(다)의 특성을 벤 다이어그램으로 나타낸 것이다. (가)~(다)는 각각 70% 에탄올, 100% 에탄올, 비누 중 하나이다.",
                visual: `
                <div class="flex justify-center my-4">
                    <svg viewBox="0 0 240 220" class="w-56 h-auto bg-white border p-2">
                        <circle cx="85" cy="85" r="60" fill="none" stroke="black" stroke-width="1.5" />
                        <text x="30" y="40" font-size="14" font-weight="bold">가</text>
                        <circle cx="155" cy="85" r="60" fill="none" stroke="black" stroke-width="1.5" />
                        <text x="195" y="40" font-size="14" font-weight="bold">나</text>
                        <circle cx="120" cy="145" r="60" fill="none" stroke="black" stroke-width="1.5" />
                        <text x="160" y="210" font-size="14" font-weight="bold">다</text>
                        <text x="65" y="80" font-size="14">a</text>
                        <text x="115" y="80" font-size="14">b</text>
                        <text x="165" y="80" font-size="14">?</text>
                        <text x="115" y="115" font-size="14">c</text>
                        <text x="85" y="135" font-size="14">?</text>
                        <text x="145" y="135" font-size="14">d</text>
                    </svg>
                </div>
                <div class="text-sm">
                    조건 1: '수분을 급격히 탈취하여 방어막 붕괴 지연'은 a에 속함.<br>
                    조건 2: '물 분자가 방역 기전의 핵심 촉매'는 b+c에 속함.
                </div>`,
                bogi: [
                    "ㄱ. (가)는 100% 에탄올이다.",
                    "ㄴ. '유기물 표면에서 캡슐화 역효과를 유발'은 (나)만의 고유 영역이다.",
                    "ㄷ. '엔트로피가 증가하는 방향으로 자발적 미셀 형성'은 (다)만의 고유 영역이다."
                ],
                options: ["① ㄱ", "② ㄴ", "③ ㄱ, ㄷ", "④ ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"],
                answer: 1
            },
            {
                id: 11,
                title: "[문제 11] 다음은 교내 방역 로봇의 의사결정 회로도이다.\n[입력] 손 표면 스캔 ➔ [조건판별 A] ➔ (YES) [결과 1: 물질 X 분사 후 건조] / (NO) [결과 2: 물질 Y 도포 후 흐르는 물 세정]",
                visual: "",
                bogi: [
                    "ㄱ. [조건판별 A]의 기준은 \"표면에 유기물이 존재하는가?\" 이다.",
                    "ㄴ. X는 사체를 표면에 잔류시키는 방식을 취한다.",
                    "ㄷ. 이 로봇의 알고리즘 상, 건조한 도서관 문손잡이를 만진 학생에게는 [결과 1]이 처방된다."
                ],
                options: ["① ㄱ", "② ㄴ", "③ ㄱ, ㄴ", "④ ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"],
                answer: 4
            }
        ];

        // --- [상태 변수] ---
        let currentMode = null;
        let currentQuestion = null;
        let isAnswered = false;

        // --- [로직: 화면 전환 및 문제 세팅] ---
        function resetToHome() {
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
        }

        function loadQuestion(mode) {
            currentMode = mode;
            isAnswered = false;
            
            // 데이터 선택 및 랜덤 추출
            const dataList = mode === 'easy' ? easyQuestions : hardQuestions;
            const randomIndex = Math.floor(Math.random() * dataList.length);
            currentQuestion = dataList[randomIndex];

            // UI 업데이트
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('feedback-area').classList.add('hidden');
            document.getElementById('quiz-controls').classList.add('hidden');
            
            // 뱃지 설정
            const badge = document.getElementById('quiz-type-badge');
            if (mode === 'easy') {
                badge.innerText = '🌱 쉬운 문제 (O/X)';
                badge.className = 'px-3 py-1 rounded-full bg-green-100 text-green-800 border border-green-300';
            } else {
                badge.innerText = '🔥 고난도 문제 (객관식)';
                badge.className = 'px-3 py-1 rounded-full bg-red-100 text-red-800 border border-red-300';
            }

            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('question-content');
            let html = `<div class="text-xl font-bold leading-relaxed mb-6">${currentQuestion.title}</div>`;

            if (currentMode === 'easy') {
                // O/X 버튼 렌더링
                html += `
                <div class="flex justify-center gap-8 mt-12">
                    <button onclick="checkAnswer('O')" class="ox-btn w-32 h-32 text-6xl font-black text-blue-500 rounded-full border-4 border-blue-500 hover:bg-blue-500 hover:text-white shadow-xl">O</button>
                    <button onclick="checkAnswer('X')" class="ox-btn w-32 h-32 text-6xl font-black text-red-500 rounded-full border-4 border-red-500 hover:bg-red-500 hover:text-white shadow-xl">X</button>
                </div>`;
            } else {
                // 시각 자료, 보기, 객관식 선지 렌더링
                if (currentQuestion.visual) {
                    html += `<div class="my-6">${currentQuestion.visual}</div>`;
                }
                if (currentQuestion.bogi && currentQuestion.bogi.length > 0) {
                    html += `<div class="border-2 border-gray-800 p-5 mb-6 bg-gray-50 rounded-md">
                                <div class="font-bold mb-3">&lt;보기&gt;</div>`;
                    currentQuestion.bogi.forEach(item => {
                        html += `<div class="mb-2 text-base">${item}</div>`;
                    });
                    html += `</div>`;
                }
                html += `<div class="flex flex-wrap gap-4 mt-6" id="options-container">`;
                currentQuestion.options.forEach((opt, idx) => {
                    const optValue = idx + 1;
                    html += `
                        <button id="opt-${optValue}" onclick="checkAnswer(${optValue})" class="flex-1 min-w-[100px] p-4 text-center border-2 border-gray-300 rounded-lg hover:bg-gray-100 hover:border-gray-400 font-bold text-lg transition-colors">
                            ${opt}
                        </button>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // --- [로직: 정답 확인] ---
        function checkAnswer(userAnswer) {
            if (isAnswered) return;
            isAnswered = true;

            const isCorrect = userAnswer === currentQuestion.answer;
            const feedbackArea = document.getElementById('feedback-area');
            const controls = document.getElementById('quiz-controls');

            // 버튼 비활성화 및 스타일 처리
            if (currentMode === 'hard') {
                const buttons = document.querySelectorAll('#options-container button');
                buttons.forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                });
                // 선택한 버튼 강조
                document.getElementById(`opt-${userAnswer}`).classList.remove('opacity-50', 'bg-gray-100');
                document.getElementById(`opt-${userAnswer}`).classList.add('bg-blue-100', 'border-blue-500');
            } else {
                const buttons = document.querySelectorAll('.ox-btn');
                buttons.forEach(btn => btn.disabled = true);
            }

            // 피드백 텍스트 및 색상 결정
            feedbackArea.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (isCorrect) {
                feedbackArea.classList.add('bg-green-100', 'text-green-800');
                feedbackArea.innerHTML = `🎉 정답입니다!`;
            } else {
                feedbackArea.classList.add('bg-red-100', 'text-red-800');
                let explainText = currentMode === 'easy' && currentQuestion.explain ? `<p class="mt-2 text-sm font-normal text-gray-700">${currentQuestion.explain}</p>` : '';
                feedbackArea.innerHTML = `❌ 오답입니다. (정답: ${currentQuestion.answer})${explainText}`;
            }

            controls.classList.remove('hidden');
        }

    </script>
</body>
</html>
