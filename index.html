<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손 씻기 방역 QUIZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
        .ox-btn { transition: all 0.2s ease-in-out; }
        .ox-btn:hover { transform: scale(1.05); }
        .ox-btn:active { transform: scale(0.95); }
        .hide { display: none !important; }
        
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-900">

    <div id="loading-overlay" class="fixed inset-0 bg-white bg-opacity-90 z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="loader mb-4"></div>
        <p class="text-gray-700 font-bold" id="loading-text">데이터를 불러오는 중입니다...</p>
    </div>

    <nav class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center relative z-10">
        <div class="font-bold text-xl tracking-wide flex items-center gap-2">🧬 방역 원리 학습 시스템</div>
        <div class="flex gap-4">
            <button onclick="switchMode('student')" id="nav-student" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500 font-bold transition">학생 모드</button>
            <button onclick="switchMode('admin')" id="nav-admin" class="px-4 py-2 bg-gray-700 rounded hover:bg-gray-600 font-bold transition">관리자 모드</button>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto my-8 bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200">

        <!-- [학생 모드] -->
        <div id="view-student" class="view-section">
            <div class="bg-blue-900 text-white p-6 text-center border-b-4 border-blue-700">
                <h1 class="text-3xl font-extrabold tracking-tight cursor-pointer" onclick="resetToHome()">손 씻기 방역 QUIZ</h1>
                <p class="mt-2 text-blue-200 text-sm">개념 확인부터 실전 문제까지, 1문제씩 랜덤으로 풀어보세요!</p>
            </div>

            <div id="home-screen" class="p-8 text-center space-y-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-8">풀이할 문제의 난이도를 선택하세요</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <button onclick="loadQuestion('easy')" class="group flex flex-col items-center justify-center p-8 bg-green-50 border-2 border-green-500 rounded-xl hover:bg-green-500 hover:text-white transition-all shadow-sm">
                        <span class="text-4xl mb-4">🌱</span>
                        <span class="text-2xl font-bold mb-2">개념 확인 (O/X)</span>
                        <span class="text-sm opacity-80 font-medium">손 위생 원리 랜덤 뽑기</span>
                    </button>
                    <button onclick="loadQuestion('hard')" class="group flex flex-col items-center justify-center p-8 bg-red-50 border-2 border-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-all shadow-sm">
                        <span class="text-4xl mb-4">🔥</span>
                        <span class="text-2xl font-bold mb-2">실전 고난도 (객관식)</span>
                        <span class="text-sm opacity-80 font-medium">데이터 분석 랜덤 뽑기</span>
                    </button>
                </div>
                
                <!-- 원하는 문제 직접 선택하기 버튼 추가 -->
                <div class="mt-8 pt-8 border-t border-gray-200">
                    <button onclick="showQuestionList()" class="px-6 py-3 bg-gray-800 text-white font-bold rounded-lg shadow hover:bg-gray-700 transition">
                        📋 원하는 문제 직접 선택하기
                    </button>
                </div>
            </div>

            <!-- [새로운 화면] 문제 목록 스크린 -->
            <div id="list-screen" class="hide p-6 md:p-10 bg-gray-50">
                <div class="flex justify-between items-center mb-6 text-sm font-bold text-gray-500 border-b pb-4">
                    <span class="px-3 py-1 rounded-full bg-gray-200 text-gray-700">문제 목록</span>
                    <button onclick="resetToHome()" class="hover:text-blue-600 underline">처음으로 돌아가기</button>
                </div>
                <div id="question-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- JS로 동적 생성 -->
                </div>
            </div>

            <div id="quiz-screen" class="hide p-6 md:p-10">
                <div class="flex justify-between items-center mb-6 text-sm font-bold text-gray-500 border-b pb-4">
                    <span id="quiz-type-badge" class="px-3 py-1 rounded-full bg-gray-200">난이도</span>
                    <button onclick="resetToHome()" class="hover:text-blue-600 underline">처음으로 돌아가기</button>
                </div>
                <div id="question-content" class="min-h-[200px]"></div>
                
                <div id="feedback-area" class="hide mt-8 p-6 rounded-lg text-center font-bold text-xl transition-all duration-300"></div>
                
                <div id="quiz-controls" class="hide mt-8 flex flex-col sm:flex-row justify-center gap-4">
                    <button onclick="loadQuestion(currentMode)" class="px-8 py-3 bg-blue-600 text-white font-bold rounded-lg shadow-lg hover:bg-blue-700 transition-colors">다음 랜덤 뽑기 🎲</button>
                    <!-- 문제 목록 보기 버튼 추가 -->
                    <button onclick="showQuestionList()" class="px-8 py-3 bg-gray-600 text-white font-bold rounded-lg shadow-lg hover:bg-gray-700 transition-colors">문제 목록 보기 📋</button>
                </div>
            </div>
        </div>

        <!-- [관리자 모드] -->
        <div id="view-admin" class="view-section hide">
            <div class="bg-gray-800 text-white p-6 text-center border-b-4 border-gray-600 flex justify-between items-center">
                <h1 class="text-2xl font-bold">🛠️ 관리자 대시보드</h1>
                <button onclick="openEditor(null)" class="bg-green-500 hover:bg-green-400 text-white px-4 py-2 rounded font-bold text-sm shadow">+ 새 문제 추가</button>
            </div>

            <div id="admin-list" class="p-6 overflow-x-auto">
                <div class="mb-4 flex justify-between items-end">
                    <h2 class="text-xl font-bold text-gray-800">📊 문항별 통계 및 관리 (클라우드 연동)</h2>
                    <button onclick="resetAllStats()" class="text-xs text-red-500 hover:underline">통계 초기화</button>
                </div>
                <table class="w-full text-left border-collapse bg-white shadow-sm rounded-lg overflow-hidden">
                    <thead class="bg-gray-100 border-b-2 border-gray-300">
                        <tr>
                            <th class="p-3 text-sm font-bold text-gray-600">ID</th>
                            <th class="p-3 text-sm font-bold text-gray-600">유형</th>
                            <th class="p-3 text-sm font-bold text-gray-600 w-1/3">문제 내용</th>
                            <th class="p-3 text-sm font-bold text-gray-600 text-center">풀이 횟수</th>
                            <th class="p-3 text-sm font-bold text-gray-600 text-center">정답률</th>
                            <th class="p-3 text-sm font-bold text-gray-600 text-center">오답률</th>
                            <th class="p-3 text-sm font-bold text-gray-600 text-center">관리</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-gray-200 text-sm"></tbody>
                </table>
            </div>

            <!-- 에디터 -->
            <div id="admin-editor" class="hide p-6 bg-gray-50 border-t border-gray-200">
                <h2 id="editor-title" class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">문제 수정</h2>
                <form id="question-form" onsubmit="saveQuestion(event)" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">난이도 (유형)</label>
                            <select id="edit-difficulty" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" onchange="toggleEditorFields()">
                                <option value="easy">개념 확인 (O/X)</option>
                                <option value="hard">실전 고난도 (객관식)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">정답</label>
                            <input type="text" id="edit-answer" placeholder="O, X 또는 1~5 숫자" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">문제 제목 (내용)</label>
                        <textarea id="edit-title" rows="2" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-4 bg-white border rounded">
                            <label class="block text-sm font-bold text-gray-700 mb-1">이미지 URL (선택사항)</label>
                            <input type="url" id
